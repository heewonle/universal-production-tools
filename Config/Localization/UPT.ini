; 플러그인 UI 문자열의 수집·번역·컴파일 설정.
;
; 원문은 영어다. 한국어는 **번역**으로 들어간다(ko). 원문을 한국어로 두면 영어 로캘에서도
; 한국어가 그대로 보이기 때문이다 — UE는 번역이 없으면 원문을 그대로 쓴다.
;
; 경로는 모두 **프로젝트 루트 기준**이다. 플러그인 쪽 config라고 플러그인 기준이 되지 않는다.
;
; 실행:
;   UnrealEditor-Cmd.exe <프로젝트>.uproject -run=GatherText ^
;     -config="Plugins/UniversalProductionTools/Config/Localization/UPT.ini" -unattended -nosplash
;
; 결과: Content/Localization/UPT/{en,ko}/UPT.po 와 UPT.locres

[CommonSettings]
SourcePath=./Plugins/UniversalProductionTools/Content/Localization/UPT
DestinationPath=./Plugins/UniversalProductionTools/Content/Localization/UPT
ManifestName=UPT.manifest
ArchiveName=UPT.archive
PortableObjectName=UPT.po
ResourceName=UPT.locres
NativeCulture=en
CulturesToGenerate=en
CulturesToGenerate=ko
bSkipSourceCheck=true

; 1) 소스에서 LOCTEXT/NSLOCTEXT를 긁는다
[GatherTextStep0]
CommandletClass=GatherTextFromSource
SearchDirectoryPaths=./Plugins/UniversalProductionTools/Source
ExcludePathFilters=./Plugins/UniversalProductionTools/Source/UniversalProductionTools/Private/Tests/*
FileNameFilters=*.cpp
FileNameFilters=*.h
FileNameFilters=*.inl
ShouldGatherFromEditorOnlyData=true

; 2) 매니페스트 생성
[GatherTextStep1]
CommandletClass=GenerateGatherManifest

; 3) 컬처별 아카이브 생성
[GatherTextStep2]
CommandletClass=GenerateGatherArchive

; 4) 번역 파일(.po)을 아카이브로 읽어들인다. 번역은 사람이 .po에 적는다.
[GatherTextStep3]
CommandletClass=InternationalizationExport
bImportLoc=true

; 5) 아카이브를 .po로 다시 내보낸다(새로 추가된 문자열이 .po에 나타나도록)
[GatherTextStep4]
CommandletClass=InternationalizationExport
bExportLoc=true

; 6) 런타임이 읽는 .locres로 컴파일
[GatherTextStep5]
CommandletClass=GenerateTextLocalizationResource
