[FilterPlugin]
; 플러그인을 패키징할 때(UAT BuildPlugin) Source·Config·Resources 외에 **함께 넣을 파일**을 적는다.
; 여기에 없으면 패키지에서 빠진다.
;
; 영상 분석 기능은 런타임에 Tools의 파이썬 스크립트를 실제로 실행한다
; (UPTPoseReferenceAnalyzer가 ExecProcess로 부른다). 빠지면 그 기능이 조용히 실패하므로 넣는다.
/Tools/*.py
/Tools/requirements-pose-analyzer.txt
/Tools/setup_analyzer_env.bat
/Tools/setup_analyzer_env.ps1
/README.md
/README.en.md

; 넣지 않는 것: /Tools/eval/... (개발용 회귀 측정), /Tools/experimental/...,
; /Docs/... (개발 기록). 제품 사용자가 쓰지 않는다.
